name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci --prefix cloudflare
      - run: npm --prefix cloudflare run check
      - run: npm --prefix cloudflare test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: CurrentActivity-sdk-free-preview
          path: src-tauri/target/debug/CurrentActivity.exe
